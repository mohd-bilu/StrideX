{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StrideX | Verify OTP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f1117;
color:#fff;
}

.container{
width:100%;
min-height:100vh;
display:flex;
}

.left{
    width:50%;
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:flex-start;
    overflow:hidden;
    background-image:url("{% static 'Authentication/images/otp-verify-forgot.jpeg' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.70) 0%,
        rgba(0,0,0,.45) 50%,
        rgba(0,0,0,.15) 100%
    );
    z-index:1;
}

.left-content{
    position:relative;
    z-index:2;
    margin-top:70px;
    margin-left:60px;
    padding-right:40px;
}

.left-content h1{
    font-size:64px;
    font-weight:800;
    line-height:1.1;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 4px 20px rgba(0,0,0,.9);
}

.left-content p{
    margin-top:20px;
    width:360px;
    color:#fff;
    font-size:18px;
    line-height:1.8;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
}

.icon{
font-size:180px;
color:#ff8a1d;
opacity:.15;
}

.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
background:#11151d;
padding:40px;
}

.card{
width:470px;
padding:40px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border-radius:24px;
border:1px solid rgba(255,255,255,.08);
}

.card h2{
font-size:34px;
margin-bottom:10px;
}

.subtitle{
color:#bbb;
margin-bottom:35px;
line-height:1.7;
}


/* OTP */

.otp-container{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:35px;
}

.otp-input{
width:58px;
height:58px;

border:2px solid #3d4655;
outline:none;

background:#1d222d;
border-radius:12px;

text-align:center;
font-size:22px;
font-weight:600;
color:#ffffff;

transition:.3s;
}

.otp-input:hover{
border-color:#697386;
}

.otp-input:focus{
border-color:#ff8a1d;
box-shadow:0 0 0 3px rgba(255,138,29,.15);
}


/* VERIFY BUTTON */

.verify-btn{
width:100%;
height:56px;

border:none;
border-radius:14px;

background:#ff8a1d;
color:#fff;

font-size:17px;
font-weight:600;

cursor:pointer;
transition:.3s;
}

.verify-btn:hover{
background:#ff7300;
}


/* TIMER */

.timer{
margin-top:25px;
text-align:center;
color:#bbb;
}

#countdown{
color:#ff8a1d;
font-weight:700;
}


/* RESEND */

.resend{
margin-top:20px;
text-align:center;
color:#bbb;
}

.resend a{
color:#ff8a1d;
text-decoration:none;
font-weight:600;
margin-left:5px;
}


/* Disabled resend */

.resend a.disabled{
opacity:.5;
cursor:not-allowed;
}


/* Enabled resend */

.resend a.enabled{
opacity:1;
cursor:pointer;
}

.resend a.enabled:hover{
text-decoration:underline;
}


/* BACK */

.back{
margin-top:25px;
text-align:center;
}

.back a{
color:#ff8a1d;
text-decoration:none;
}


/* RESPONSIVE */

@media(max-width:992px){

.container{
flex-direction:column;
}

.left,
.right{
width:100%;
}

.left{
height:350px;
}

.card{
width:100%;
max-width:500px;
}

}


@media(max-width:576px){

.right{
padding:20px;
}

.card{
padding:25px;
}

.otp-container{
gap:6px;
}

.otp-input{
width:44px;
height:50px;
font-size:20px;
}

}

</style>

</head>


<body>


<div class="container">


<div class="left">

<div class="overlay"></div>


<div class="left-content">

<h1>

VERIFY<br>

OTP

</h1>


<p>

Enter the verification code sent to

<br><br>

<strong>{{ email }}</strong>

</p>

</div>


<div class="icon">

<i class="fa-solid fa-shield-halved"></i>

</div>


</div>



<div class="right">


<div class="card">


<h2>OTP Verification</h2>


<p class="subtitle">

Enter the six digit code.

</p>



<form method="POST" id="otpForm">


{% csrf_token %}


<div class="otp-container">


<input
type="text"
class="otp-input"
maxlength="1"
inputmode="numeric"
autocomplete="one-time-code">


<input
type="text"
class="otp-input"
maxlength="1"
inputmode="numeric">


<input
type="text"
class="otp-input"
maxlength="1"
inputmode="numeric">


<input
type="text"
class="otp-input"
maxlength="1"
inputmode="numeric">


<input
type="text"
class="otp-input"
maxlength="1"
inputmode="numeric">


<input
type="text"
class="otp-input"
maxlength="1"
inputmode="numeric">


</div>



<input
type="hidden"
name="otp"
id="otp">



<button
type="submit"
class="verify-btn">

Verify OTP

</button>


</form>



<div class="timer">

Time Remaining :

<span id="countdown">

02:00

</span>

</div>



<div class="resend">

Didn't receive the OTP?

<a
href="{% url 'resend_forgot_password_otp' %}"
id="resendBtn"
class="disabled"
aria-disabled="true">

Resend OTP

</a>

</div>



<div class="back">


<a href="{% url 'login' %}">


<i class="fa-solid fa-arrow-left"></i>

Back to Login


</a>


</div>


</div>


</div>


</div>



<script>


/* =============================
   OTP INPUTS
============================= */


const inputs =
document.querySelectorAll(".otp-input");


const hidden =
document.getElementById("otp");



function updateOTP(){

hidden.value =
Array.from(inputs)
.map(input => input.value)
.join("");

}



inputs.forEach((input,index)=>{


input.addEventListener(
"input",
function(){


this.value =
this.value.replace(/\D/g,'');


if(
this.value
&&
index < inputs.length - 1
){

inputs[index + 1].focus();

}


updateOTP();


});


input.addEventListener(
"keydown",
function(event){


if(
event.key === "Backspace"
&&
!this.value
&&
index > 0
){

inputs[index - 1].focus();

}


});


});



/* =============================
   PASTE OTP
============================= */


inputs[0].addEventListener(
"paste",
function(event){


event.preventDefault();


const data =

(
event.clipboardData
||
window.clipboardData
)

.getData("text")

.replace(/\D/g,"")

.substring(0,6);



data
.split("")
.forEach((number,index)=>{


if(inputs[index]){

inputs[index].value =
number;

}


});


updateOTP();


if(data.length === 6){

inputs[5].focus();

}


});

let seconds = 120;


const timer =
document.getElementById(
"countdown"
);


const resendBtn =
document.getElementById(
"resendBtn"
);



/* Prevent click while disabled */


resendBtn.addEventListener(
"click",
function(event){


if(
this.classList.contains(
"disabled"
)
){

event.preventDefault();

return false;

}


});



/* =============================
   TIMER
============================= */


const interval =
setInterval(function(){


const minutes =
Math.floor(seconds / 60);


const remainingSeconds =
seconds % 60;



timer.textContent =

String(minutes)
.padStart(2,"0")

+

":"

+

String(remainingSeconds)
.padStart(2,"0");



if(seconds <= 0){


clearInterval(interval);


timer.textContent =
"Expired";


resendBtn
.classList
.remove("disabled");


resendBtn
.classList
.add("enabled");


resendBtn
.setAttribute(
"aria-disabled",
"false"
);


return;


}


seconds--;


},1000);


</script>



{% if messages %}


<script>


document.addEventListener(
"DOMContentLoaded",
function(){


{% for message in messages %}


Swal.fire({

toast:true,

position:"top-end",

icon:"{{ message.tags }}",

title:"{{ message|escapejs }}",

showConfirmButton:false,

timer:4000,

timerProgressBar:true,

background:"#1d222d",

color:"#fff"

});


{% endfor %}


});


</script>


{% endif %}


</body>

</html>
