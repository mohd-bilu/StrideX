{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StrideX | Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0f1117;
            color:#fff;
        }

        .container{
            width:100%;
            min-height:100vh;
            display:flex;
        }

        .left{
            width:50%;
            min-height:100vh;
            position:relative;
            display:flex;
            align-items:center;
            overflow:hidden;
            background:url("{% static 'Authentication/images/forgot-password.png' %}") center/cover no-repeat;
        }

        .overlay{
            position:absolute;
            inset:0;
            background:linear-gradient(
                90deg,
                rgba(0,0,0,.88) 0%,
                rgba(0,0,0,.70) 55%,
                rgba(0,0,0,.40) 100%
            );
            z-index:1;
        }

        .left-content{
            position:relative;
            z-index:2;
            padding:0 60px;
        }

        .left-content h1{
            font-size:60px;
            font-weight:800;
            line-height:1.1;
            color:#fff;
            text-shadow:0 3px 15px rgba(0,0,0,.9);
        }

        .left-content p{
            width:100%;
            max-width:400px;
            margin-top:20px;
            line-height:1.8;
            color:#eee;
            font-size:15px;
            text-shadow:0 2px 8px rgba(0,0,0,.9);
        }

        .right{
            width:50%;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
            background:#11151d;
        }

        .card{
            width:470px;
            background:rgba(255,255,255,.05);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border-radius:24px;
            padding:40px;
            border:1px solid rgba(255,255,255,.08);
        }

        .card h2{
            font-size:34px;
            margin-bottom:10px;
        }

        .subtitle{
            margin-bottom:30px;
            color:#bbb;
            line-height:1.7;
        }

        .input-box{
            margin-bottom:25px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-field{
            display:flex;
            align-items:center;
            background:#1d222d;
            height:58px;
            border-radius:12px;
            padding:0 18px;
            border:1px solid transparent;
            transition:.3s;
        }

        .input-field:focus-within{
            border-color:#ff8a1d;
        }

        .input-field i{
            margin-right:12px;
            color:#888;
        }

        .input-field input{
            width:100%;
            background:none;
            border:none;
            outline:none;
            color:#fff;
            font-size:15px;
        }

        .input-field input::placeholder{
            color:#777;
        }

        .send-btn{
            width:100%;
            height:56px;
            border:none;
            border-radius:14px;
            background:#ff8a1d;
            color:#fff;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .send-btn i{
            margin-left:8px;
        }

        .send-btn:hover{
            background:#ff7300;
            transform:translateY(-1px);
        }

        .back{
            margin-top:25px;
            text-align:center;
        }

        .back a{
            color:#ff8a1d;
            text-decoration:none;
            font-size:14px;
        }

        .back a i{
            margin-right:6px;
        }

        .back a:hover{
            text-decoration:underline;
        }

        @media(max-width:992px){
            .container{
                flex-direction:column;
            }

            .left,
            .right{
                width:100%;
            }

            .left{
                min-height:400px;
            }

            .right{
                min-height:600px;
            }

            .left-content{
                padding:0 40px;
            }

            .left-content h1{
                font-size:48px;
            }

            .card{
                width:100%;
                max-width:500px;
            }
        }

        @media(max-width:576px){
            .left{
                min-height:350px;
            }

            .left-content{
                padding:0 25px;
            }

            .left-content h1{
                font-size:40px;
            }

            .left-content p{
                font-size:13px;
                line-height:1.7;
            }

            .right{
                min-height:550px;
                padding:30px 18px;
            }

            .card{
                padding:30px 25px;
                border-radius:18px;
            }

            .card h2{
                font-size:28px;
            }

            .subtitle{
                font-size:14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">

            <div class="overlay"></div>

            <div class="left-content">
                <h1>
                    FORGOT<br>
                    PASSWORD
                </h1>

                <p>
                    Enter your registered email address.
                    We'll send you a One Time Password (OTP)
                    to reset your password.
                </p>
            </div>

        </div>

        <div class="right">

            <div class="card">

                <h2>Forgot Password</h2>

                <p class="subtitle">
                    Enter your registered email address.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="input-box">

                        <label>Email Address</label>

                        <div class="input-field">
                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                name="email"
                                placeholder="name@example.com"
                                required
                            >
                        </div>

                    </div>

                    <button type="submit" class="send-btn">
                        Send OTP
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                    <div class="back">
                        <a href="{% url 'login' %}">
                            <i class="fa-solid fa-arrow-left"></i>
                            Back to Login
                        </a>
                    </div>

                </form>

            </div>

        </div>

    </div>

    {% if messages %}
    <script>
        document.addEventListener("DOMContentLoaded", function(){

            {% for message in messages %}

            Swal.fire({
                toast:true,
                position:"top-end",
                icon:"{% if message.tags == 'error' %}error{% else %}{{ message.tags }}{% endif %}",
                title:"{{ message|escapejs }}",
                showConfirmButton:false,
                timer:3000,
                timerProgressBar:true,
                background:"#1d222d",
                color:"#fff"
            });

            {% endfor %}

        });
    </script>
    {% endif %}

    <script>
        window.history.forward();
    </script>

</body>

</html>
