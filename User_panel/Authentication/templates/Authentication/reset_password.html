{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StrideX | Reset Password</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f1117;
color:#fff;
}

.container{
width:100%;
min-height:100vh;
display:flex;
}

.left{
    width:50%;
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:flex-start;
    overflow:hidden;
    background-image:url("{% static 'Authentication/images/resetpassword-forgot
    .png' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.70) 0%,
        rgba(0,0,0,.45) 50%,
        rgba(0,0,0,.15) 100%
    );
    z-index:1;
}

.left-content{
    position:relative;
    z-index:2;
    margin-top:70px;
    margin-left:60px;
    padding-right:40px;
}

.left-content h1{
    font-size:64px;
    font-weight:800;
    line-height:1.1;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 4px 20px rgba(0,0,0,.9);
}

.left-content p{
    margin-top:20px;
    width:360px;
    color:#fff;
    font-size:18px;
    line-height:1.8;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
}
.icon{
font-size:180px;
color:#ff8a1d;
opacity:.15;
}

.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
background:#11151d;
padding:40px;
}

.card{
width:470px;
padding:40px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border-radius:24px;
border:1px solid rgba(255,255,255,.08);
}

.card h2{
font-size:34px;
margin-bottom:10px;
}

.subtitle{
margin-bottom:30px;
color:#bbb;
line-height:1.7;
}

.input-box{
margin-bottom:25px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-size:14px;
}

.input-field{
display:flex;
align-items:center;
background:#1d222d;
height:58px;
border-radius:12px;
padding:0 18px;
}

.input-field i{
color:#888;
margin-right:12px;
}

.input-field input{
width:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:15px;
}

.toggle-password{
cursor:pointer;
margin-left:10px;
}

.reset-btn{
width:100%;
height:56px;
border:none;
border-radius:14px;
background:#ff8a1d;
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.reset-btn:hover{
background:#ff7300;
}

.back{
margin-top:25px;
text-align:center;
}

.back a{
color:#ff8a1d;
text-decoration:none;
}

@media(max-width:992px){

.container{
flex-direction:column;
}

.left,
.right{
width:100%;
}

.left{
height:350px;
}

.card{
width:100%;
max-width:500px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="overlay"></div>

<div class="left-content">

<h1>

RESET<br>

PASSWORD

</h1>

<p>

Choose a strong password to secure your StrideX account.

</p>

</div>

<div class="icon">

<i class="fa-solid fa-key"></i>

</div>

</div>

<div class="right">

<div class="card">

<h2>Create New Password</h2>

<p class="subtitle">

Your new password must be at least 8 characters long.

</p>

<form method="POST">

{% csrf_token %}

<div class="input-box">

<label>New Password</label>

<div class="input-field">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
name="new_password"
placeholder="Enter new password"
required>

<i
class="fa-solid fa-eye toggle-password"
id="togglePassword"></i>

</div>

</div>

<div class="input-box">

<label>Confirm Password</label>

<div class="input-field">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
name="confirm_password"
placeholder="Confirmpassword"
required>

<i
class="fa-solid fa-eye toggle-password"
id="toggleConfirmPassword"></i>

</div>

</div>

<button
type="submit"
class="reset-btn">

Update Password

</button>

<div class="back">

<a href="{% url 'login' %}">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</div>

</form>

</div>

</div>

</div>

<script>

function togglePassword(inputId,iconId){

const input=document.getElementById(inputId);

const icon=document.getElementById(iconId);

icon.addEventListener("click",function(){

if(input.type==="password"){

input.type="text";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}else{

input.type="password";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}

});

}

togglePassword("password","togglePassword");

togglePassword("confirmPassword","toggleConfirmPassword");

</script>

{% if messages %}

<script>

document.addEventListener("DOMContentLoaded",function(){

{% for message in messages %}

Swal.fire({

toast:true,

position:"top-end",

icon:"{{ message.tags }}",

title:"{{ message|escapejs }}",

showConfirmButton:false,

timer:3000,

timerProgressBar:true,

background:"#1d222d",

color:"#fff"

});

{% endfor %}

});

</script>

{% endif %}

</body>

</html>
