{% extends "user_base.html" %}

{% block title %}
Complete Payment
{% endblock %}

{% block content %}

<div style="
    max-width:480px;
    margin:80px auto;
    padding:30px;
    text-align:center;
">

    <p>
        WALLET
    </p>

    <h1>
        Complete Payment
    </h1>

    <p>
        Add ₹{{ amount|floatformat:2 }} to your wallet.
    </p>

    <button
        id="pay-button"
        type="button"
        style="
            width:100%;
            height:50px;
            border:0;
            border-radius:25px;
            background:#050505;
            color:#fff;
            font-weight:700;
            cursor:pointer;
        "
    >
        PAY ₹{{ amount|floatformat:2 }}
    </button>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {

        const button =
            document.getElementById(
                "pay-button"
            );

        button.addEventListener(
            "click",
            function () {

                const options = {

                    key:
                        "{{ razorpay_key_id }}",

                    amount:
                        "{{ razorpay_amount }}",

                    currency:
                        "INR",

                    name:
                        "VERSE",

                    description:
                        "Wallet Top Up",

                    order_id:
                        "{{ razorpay_order_id }}",

                    handler:
                        function (response) {

                            const form =
                                document.createElement(
                                    "form"
                                );

                            form.method = "POST";

                            form.action =
                                "{% url 'wallet:payment_success' %}";

                            const csrf =
                                document.createElement(
                                    "input"
                                );

                            csrf.type = "hidden";

                            csrf.name = "csrfmiddlewaretoken";

                            csrf.value =
                                "{{ csrf_token }}";

                            form.appendChild(
                                csrf
                            );

                            const fields = {
                                razorpay_payment_id:
                                    response.razorpay_payment_id,

                                razorpay_order_id:
                                    response.razorpay_order_id,

                                razorpay_signature:
                                    response.razorpay_signature
                            };

                            Object.keys(fields).forEach(
                                function (name) {

                                    const input =
                                        document.createElement(
                                            "input"
                                        );

                                    input.type =
                                        "hidden";

                                    input.name =
                                        name;

                                    input.value =
                                        fields[name];

                                    form.appendChild(
                                        input
                                    );
                                }
                            );

                            document.body.appendChild(
                                form
                            );

                            form.submit();
                        },

                    modal: {
                        ondismiss:
                            function () {
                                button.disabled =
                                    false;

                                button.textContent =
                                    "PAY ₹{{ amount|floatformat:2 }}";
                            }
                    },

                    theme: {
                        color: "#050505"
                    }
                };

                const razorpay =
                    new Razorpay(
                        options
                    );

                razorpay.on(
                    "payment.failed",
                    function () {

                        button.disabled =
                            false;

                        button.textContent =
                            "PAY ₹{{ amount|floatformat:2 }}";

                        alert(
                            "Payment failed. Please try again."
                        );
                    }
                );

                button.disabled =
                    true;

                button.textContent =
                    "OPENING PAYMENT...";

                razorpay.open();
            }
        );
    }
);
</script>

{% endblock %}
